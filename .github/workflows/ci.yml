name: Package CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  source:
    name: PHP 8.5 source and archive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: mbstring, tokenizer, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - name: Install explicit candidate source dependencies
        run: |
          composer validate --strict
          composer install --prefer-dist --no-interaction
          composer audit --abandoned=fail
      - name: Package implementation and ownership gates
        run: composer check
  release-tests:
    name: Release automation tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify release transitions, prerequisites and repository setup
        run: |
          bash tools/test-release-record.sh
          bash tools/test-release-integrity.sh
          bash tools/test-release-on-record.sh
          bash tools/test-configure-release-repositories.sh
          bash tools/test-release-dependencies.sh
          bash tools/test-package-dependencies.sh
  gate:
    name: Package gate
    runs-on: ubuntu-latest
    needs: [source, release-tests]
    if: always()
    steps:
      - name: Require complete source and consumer checks
        env:
          RELEASE_RESULT: ${{ needs.release-tests.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
        run: test "$SOURCE_RESULT" = success && test "$RELEASE_RESULT" = success
